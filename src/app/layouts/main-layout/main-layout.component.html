<!-- Navbar with toggle button -->
<app-nav-bar (toggleSidebar)="toggleSidebar()"></app-nav-bar>

<div class="container-fluid">
  <div class="row">
    <!-- Sidebar -->
    <div class="col-md-2 p-0" [ngClass]="{ 'd-none': !sidebarOpen, 'd-block': sidebarOpen }">
      <app-side-nav-bar></app-side-nav-bar>
    </div>

    <!-- Main Content -->
    <div [class.col-md-10]="sidebarOpen" [class.col-md-12]="!sidebarOpen">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
